# Check the medmlx.org catalog on main (what `make deploy` publishes) against
# PyPI, release tags and Hugging Face
# once a day, so a new runtime release cannot leave the site stale unnoticed.
# Standard runners are free for public repositories. GitHub emails the person
# who last changed the schedule when a scheduled run fails, and disables the
# schedule after 60 days without repository activity.
name: Release check

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check
  cancel-in-progress: true

jobs:
  published-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: make release-check
